# OpenUI is available on demand in DSH's existing conversation modes.
- insert:
    - id: openui-studio
      name: '@local/dsh-openui-studio'
      config:
        provider: null
        model: null
        # null inherits the current DSH conversation and model settings.
        maxTokens: null
        temperature: null
        reasoningEffort: null
        # Append environment-specific instructions to the official OpenUI prompt.
        promptSuffix: null
        maxQuestionChars: 8000
